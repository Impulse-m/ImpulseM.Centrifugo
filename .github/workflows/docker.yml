name: docker

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve master version
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Resolve short SHA
        id: sha
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "short=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

  images:
    name: Publish master images
    needs:
      - prepare
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ format('0.0.0-{0}', needs.prepare.outputs.short) }}
      tags: |
        master
        ${{ format('sha-{0}', needs.prepare.outputs.short) }}
