name: images

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded into the binaries and used in release archive names.
        required: true
        type: string
      tags:
        description: Newline-separated image tags to publish.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/impulse-m/impulsem.centrifugo

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "docker-context/${GOARCH}"
          go build \
            -ldflags "-s -w -X github.com/centrifugal/centrifugo/v6/internal/build.Version=${VERSION}" \
            -o "docker-context/${GOARCH}/centrifugo" .

      - name: Copy notices into the image context
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          context="docker-context/${ARCH}"
          mkdir -p "$context/licenses/webui" "$context/licenses/swagger-ui"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$context/"
          cp internal/webui/THIRD_PARTY_LICENSES.txt "$context/licenses/webui/"
          cp internal/swaggerui/THIRD_PARTY_LICENSES.txt "$context/licenses/swagger-ui/"

      - name: Package release archive
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          staging="$RUNNER_TEMP/archive-${ARCH}"
          mkdir -p "$staging" dist
          cp -r "docker-context/${ARCH}/licenses" "$staging/"
          cp "docker-context/${ARCH}/centrifugo" LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md "$staging/"
          tar -czf "dist/centrifugo_${VERSION}_linux_${ARCH}.tar.gz" \
            -C "$staging" centrifugo LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md CHANGELOG.md licenses

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Prepare image tag specs
        id: specs
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          {
            echo "specs<<SPECS_EOF"
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then
                echo "type=raw,value=${tag}"
              fi
            done <<< "$TAGS"
            echo "SPECS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.specs.outputs.specs }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker-context/${{ matrix.arch }}
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          mkdir -p "$DIGESTS_DIR"
          touch "$DIGESTS_DIR/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        env:
          TAGS: ${{ inputs.tags }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=(--tag "${IMAGE_NAME}:${tag}")
            fi
          done <<< "$TAGS"

          sources=()
          for path in "$DIGESTS_DIR"/*; do
            sources+=("${IMAGE_NAME}@sha256:${path##*/}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
