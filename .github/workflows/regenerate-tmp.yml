# Temporary. Regenerates the API code and swagger from api.proto and runs go mod tidy
# on the feature branch, then uploads the results. Removed before the branch is merged.
name: regenerate-tmp
on:
  push:
    branches:
      - 'feature/server-tags'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install protoc 34.0
        run: |
          curl -sSL -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-linux-x86_64.zip
          unzip -q protoc.zip -d "$HOME/protoc"
          rm protoc.zip
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      - name: Install generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          go install github.com/fatih/gomodifytags@v1.13.0
          go install github.com/FZambia/gomodifytype@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate API code
        working-directory: internal/apiproto
        run: bash generate.sh

      - name: Generate swagger
        working-directory: internal/apiproto/swagger
        run: bash generate_swagger.sh

      - name: Tidy
        run: go mod tidy

      - name: Show the change
        run: git status --short && git diff --stat

      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            go.mod
            go.sum
            internal/apiproto/api.pb.go
            internal/apiproto/api_grpc.pb.go
            internal/apiproto/swagger/api.swagger.proto
            internal/apiproto/swagger/api.swagger.json
          if-no-files-found: error
