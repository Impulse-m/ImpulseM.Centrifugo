# Temporary: regenerates the API code from api.proto on this branch and uploads it,
# because the code generators are not run on the developer machine. Removed before merge.
name: tmp-generate
on:
  push:
    branches:
      - feature/push-webpush
    paths:
      - internal/apiproto/api.proto
      - .github/workflows/tmp-generate.yml
permissions:
  contents: read
jobs:
  generate:
    name: Generate API code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install protoc 34.0
        run: |
          curl -sSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-linux-x86_64.zip
          sudo unzip -q /tmp/protoc.zip -d /usr/local
          sudo chmod -R a+rX /usr/local/include/google /usr/local/bin/protoc
          protoc --version
      - name: Install generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          go install github.com/fatih/gomodifytags@v1.13.0
          go install github.com/FZambia/gomodifytype@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
      - name: Generate
        run: |
          cd internal/apiproto
          bash generate.sh
          cd swagger
          bash generate_swagger.sh
      - name: Show what changed
        run: |
          gofmt -l internal/apiproto || true
          git status --short
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: apiproto-generated
          path: |
            internal/apiproto/api.pb.go
            internal/apiproto/api_grpc.pb.go
            internal/apiproto/swagger/api.swagger.proto
            internal/apiproto/swagger/api.swagger.json
